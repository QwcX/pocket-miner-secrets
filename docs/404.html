<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // This script redirects all 404s to index.html for client-side routing
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    // Store the path in sessionStorage so we can restore it after redirect
    sessionStorage.setItem('redirect', path + search + hash);
    
    // Redirect to the root
    window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, 2).join('/') + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
