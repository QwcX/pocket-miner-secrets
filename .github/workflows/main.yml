name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build
        run: npm run build
        env:
          # Fallbacks prevent blank screen on GitHub Pages if repo secrets are missing.
          # These are publishable/public values.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://iqrbqygekyfgfcwoiavs.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxcmJxeWdla3lmZ2Zjd29pYXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMDMwNjgsImV4cCI6MjA4MjU3OTA2OH0.o81xcjLsEPkcrtpVh5BhXuB_DsL1Ugzs6IMghZ7_Tcw' }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Ensure GitHub Pages refresh/deep-links never show a white screen
      # by serving the SPA shell for 404s as well.
      - name: SPA fallback (copy index -> 404) and .nojekyll
        run: |
          cp ./dist/index.html ./dist/404.html
          touch ./dist/.nojekyll

      # Optionally sync dist -> docs for static hosting from repo (not recommended, use Pages artifact instead)
      # - name: Copy dist to docs
      #   run: |
      #     rm -rf ./docs
      #     cp -r ./dist ./docs
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
